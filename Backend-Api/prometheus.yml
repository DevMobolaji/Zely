global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "zely-api"
    static_configs:
      # prometheus.yml (for local dev — app on port 5000)
      - targets: ["172.18.0.1:5000"]
      # prometheus.prod.yml (for Docker — app on port 3000)
      - targets: ["172.18.0.1:3000"]
    metrics_path: "/metrics"
    scrape_interval: 10s

  - job_name: "kafka"
    static_configs:
      - targets: ["zely-kafka-exporter:9308"]
    scrape_interval: 30s

  - job_name: "pushgateway"
    static_configs:
      - targets: ["zely-pushgateway:9091"]
    honor_labels: true
